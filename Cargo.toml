[package]
name = "conveyor"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "TUI for the path of a change: pull requests, merge queue, main builds, deployed"
repository = "https://github.com/piacsek/conveyor"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
insta = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
