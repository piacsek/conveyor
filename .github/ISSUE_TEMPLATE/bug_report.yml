name: Bug report
description: Something conveyor shows or does is wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not paste private organisation or repository names, pull request titles, logins, hostnames or cluster names. Replace them with `acme/*` or `<owner>/<repo>`, in screenshots too.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The keys you pressed or the state the pull request or build was in. Say whether `conveyor --demo` shows it too.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What `conveyor --version` prints.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Operating system and terminal
      placeholder: macOS 26, Ghostty inside tmux
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The relevant part of what `conveyor config` prints, with private names replaced.
      render: toml
